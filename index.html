<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1219; }
      #app { position: fixed; inset: 0; display: block; }
      /* The HUD builds its own markup and styles; this only positions the layer. */
      #hud {
        position: fixed; inset: 0; pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, .85);
      }
      #hud-death { pointer-events: auto; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
